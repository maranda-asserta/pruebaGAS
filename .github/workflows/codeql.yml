name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 3 * * 1'

env:
  JAVA_VERSION: '21'
  
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: 'ubuntu-latest'
    permissions:
      security-events: write
      actions: read
      contents: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        language: ["java-kotlin", "javascript-typescript"]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up JDK
      if: matrix.language == 'java-kotlin'
      uses: actions/setup-java@v5
      with:
        distribution: "temurin"
        java-version: ${{ env.JAVA_VERSION }}

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v5
      with:
        languages: ${{ matrix.language }}
        queries: security-and-quality

    - name: Install DBUpgrade-6.0.1.19.jar to local Maven repo
      if: matrix.language == 'java-kotlin'
      run: |
        mvn install:install-file \
          -Dfile=lib/DBUpgrade-6.0.1.19.jar \
          -DgroupId=com.logister.tools \
          -DartifactId=DBUpgrade \
          -Dversion=6.0.1.19 \
          -Dpackaging=jar \
          -DgeneratePom=true

    - name: Build with Maven
      if: matrix.language == 'java-kotlin'
      run: mvn -B clean package -DskipTests

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v5
      with:
        category: "codeql-${{ matrix.language }}"
